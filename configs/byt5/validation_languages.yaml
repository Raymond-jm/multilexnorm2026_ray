# ByT5 experiments for languages that have a public validation split.
#
# This file is a manual experiment manifest, not an automatic runner yet.
# The language sample JSONL files already exist under sample_data/byt5/lang.
# The user should choose one language block and run train/evaluate commands
# from the project root.  The build command is kept only as a regeneration
# reference in case a sample file is intentionally rebuilt later.

dataset:
  name: multilexnorm2026-dev-pub
  data_dir: data/raw/multilexnorm2026-dev-pub
  train_split: train
  validation_split: validation

defaults:
  model_name: google/byt5-small
  sample_dir: sample_data/byt5/lang
  output_root: outputs/byt5
  batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-5
  warmup_steps: 100
  max_input_length: 256
  max_target_length: 32
  eval_batch_size: 64
  max_new_tokens: 32
  log_every: 10
  save_every: 5000
  seed: 42
  max_examples: -1
  limit_sentences: -1
  sample_files_prebuilt: true

validation_languages:
  - de
  - en
  - hr
  - id
  - iden
  - ja
  - ko
  - nl
  - sl
  - sr
  - th
  - vi

languages:
  de:
    train_rows: 1628
    train_token_examples: 15006
    validation_rows: 573
    validation_token_examples: 4860
    validation_changed_tokens: 873
    max_steps_1epoch_bs4: 3752
    train_examples: sample_data/byt5/lang/train_de_examples.jsonl
    output_dir: outputs/byt5/lang_de_1epoch_bs4
    validation_output_dir: outputs/byt5/lang_de_1epoch_bs4/validation_eval_de
    commands:
      regenerate_sample: python3 scripts/byt5/build_lang_byt5_examples.py --lang de --output-dir sample_data/byt5/lang
      train: python3 scripts/byt5/finetune_byt5.py --examples sample_data/byt5/lang/train_de_examples.jsonl --output-dir outputs/byt5/lang_de_1epoch_bs4 --model-name google/byt5-small --max-examples -1 --max-steps 3752 --batch-size 4 --gradient-accumulation-steps 1 --learning-rate 5e-5 --warmup-steps 100 --max-input-length 256 --max-target-length 32 --log-every 10
      evaluate: python3 scripts/byt5/evaluate_checkpoint.py --checkpoint outputs/byt5/lang_de_1epoch_bs4/checkpoint --output-dir outputs/byt5/lang_de_1epoch_bs4/validation_eval_de --lang de --batch-size 64 --limit-sentences -1

